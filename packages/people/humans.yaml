automation:
  - alias: Home - People - Phone out of battery
    id: '1673901325564'
    description: ''
    trigger:
    - platform: state
      entity_id:
      - sensor.carols_phone_battery_level
      to: '0'
      for:
        hours: 0
        minutes: 10
        seconds: 0
      id: Carol's phone
    - platform: state
      entity_id:
      - sensor.carols_phone_battery_level
      to:
      - unavailable
      - unknown
      for:
        minutes: 5
      id: Carol's phone
    - platform: state
      entity_id:
      - sensor.edwards_phone_battery_level_2
      to: '0'
      for:
        hours: 0
        minutes: 10
        seconds: 0
      id: Edward's phone
    - platform: state
      entity_id:
      - sensor.edwards_phone_battery_level_2
      to:
      - unavailable
      - unknown
      for:
        minutes: 5
      id: Edward's phone
    condition: []
    action:
    - service: notify.group_home
      data:
        message: 'Phone out of battery:

          Trigger id: {{ trigger.id }}

          Entity: {{ trigger.entity_id }}'
    mode: single

group:
  hosts:
    name: Hosts
    entities:
      - person.edward_firmo
      - person.carolina_costa
  guests:
    name: Guests
    entities:
      - person.lara

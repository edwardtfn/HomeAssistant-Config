sensor:
  - id: stack_high_water_mark
    name: "Stack High Water Mark"
    platform: template
    entity_category: diagnostic
    icon: mdi:memory
    unit_of_measurement: "B"
    accuracy_decimals: 0
    update_interval: 1s
    filters:
      - delta: 1
    lambda: return static_cast<float>(uxTaskGetStackHighWaterMark(nullptr));

  - platform: template
    name: "Nextion queue max size"
    update_interval: 1s
    unit_of_measurement: "items"
    accuracy_decimals: 0
    lambda: |-
      return (float) disp1->queue_size();
    filters:
      - max:
          window_size: 60
          send_every: 60
          send_first_at: 60

  - platform: uptime
    type: timestamp
    name: Uptime

switch:
  - id: !extend screen_power
    internal: false

  # Expose relay local control switch to Home Assistant
  - name: Relay 1 Local
    platform: template
    id: relay1_local
    entity_category: config
    internal: false
    optimistic: true
    lambda: |-
      return static_cast<bool>(id(hardware_settings).relay1_local);
    on_state:
      then:
        - lambda: |-
            id(hardware_settings).relay1_local = x;
            ESP_LOGI("custom", "Relay 1 Local turned %s", ONOFF(x));
  - name: Relay 2 Local
    platform: template
    id: relay2_local
    entity_category: config
    internal: false
    optimistic: true
    lambda: |-
      return static_cast<bool>(id(hardware_settings).relay2_local);
    on_state:
      then:
        - lambda: |-
            id(hardware_settings).relay2_local = x;
            ESP_LOGI("custom", "Relay 2 Local turned %s", ONOFF(x));

